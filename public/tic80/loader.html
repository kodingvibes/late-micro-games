<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TIC-80 loader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; width: 240px; height: 136px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; width: 240px; height: 136px; }
</style>
</head>
<body>
<canvas id="tic80-canvas" width="240" height="136" tabindex="0"></canvas>
<script>
(function () {
  "use strict";

  // ---------- messaging helpers ----------
  function post(type, detail) {
    try {
      parent.postMessage({ type: type, detail: detail || null }, "*");
    } catch (e) {
      /* parent gone, nothing to do */
    }
  }
  function postLog(level, message) {
    try {
      parent.postMessage({ type: "log", level: level, message: String(message) }, "*");
    } catch (e) { /* ignore */ }
  }
  function postError(detail) { post("error", detail); }
  function postReady() { post("ready"); }
  function postBooting() { post("booting"); }

  // ---------- uncaught error reporting ----------
  window.addEventListener("error", function (ev) {
    var msg = (ev && (ev.message || (ev.error && ev.error.message))) || "Runtime error";
    postError(msg);
  });
  window.addEventListener("unhandledrejection", function (ev) {
    var reason = ev && ev.reason;
    var msg = (reason && (reason.message || String(reason))) || "Unhandled rejection";
    postError(msg);
  });

  // ---------- runtime injection ----------
  // Runs in the iframe, isolated from the parent's globals. We only ever touch `window.Module`
  // inside the iframe; the parent never sees it. Cleanup is just `iframe.remove()`.
  function handleInit(jsBytes, wasmBytes, cartBytes, cartName) {
    // Lazy-refresh the canvas in case the parent remounted the host.
    var canvas = document.getElementById("tic80-canvas");
    if (!canvas) {
      postError("Canvas not found in iframe");
      return;
    }

    // Blob URL lets us load the JS without affecting the parent document.
    var blob = new Blob([jsBytes], { type: "text/javascript" });
    var scriptUrl = URL.createObjectURL(blob);

    // Stash cart bytes for the readAsync override (see below).
    window.__lateCartBytes = cartBytes;
    window.__lateCartName = cartName;

    window.Module = {
      canvas: canvas,
      arguments: [cartName],
      wasmBinary: wasmBytes,
      // NOTE: preRun runs BEFORE initRuntime(), so FS is NOT available here.
      // We put the cart into MEMFS inside onRuntimeInitialized instead.
      preRun: [],
      print: function (m) { postLog("log", m); },
      printErr: function (m) { postLog("error", m); },
      onRuntimeInitialized: function () {
        // 1) Put the cart into MEMFS now that FS is available.
        try {
          // If a previous cart with the same name lingered, drop it first.
          try { FS.unlink("/" + cartName); } catch (e) { /* not there yet */ }
          FS.createDataFile("/", cartName, cartBytes, true, true);
        } catch (e) {
          postError("FS.createDataFile failed: " + (e && e.message ? e.message : e));
          return;
        }

        // 2) The runtime script (tic80.js) loads asynchronously via a <script>
        //    tag.  When it executes, it overwrites `window.readAsync` with its
        //    own XHR-based version, which *also* overwrites the loader's earlier
        //    override (lines 131-145 below).  Since the iframe is sandboxed with
        //    `allow-scripts` only (no `allow-same-origin`), XHR to any URL will
        //    fail.  We re-apply our MEMFS-based override here, *after* the
        //    runtime has finished loading but *before* `callMain` runs (which
        //    triggers `FS.createPreloadedFile` → `asyncLoad` → `readAsync`).
        //    Capture the runtime's XHR readAsync as the fallback for non-cart
        //    resources (e.g. data files bundled with the cart).
        var runtimeReadAsync = window.readAsync;
        window.readAsync = function (url, onload, onerror) {
          try {
            // The runtime passes the full cart URL (e.g.
            // "https://tic80.com/cart/.../palette_demo.tic") to readAsync.
            // We check if the URL ends with the cart name.
            if (typeof url === "string" && cartName && typeof FS !== "undefined") {
              var idx = url.lastIndexOf("/");
              var basename = idx >= 0 ? url.substring(idx + 1) : url;
              // Strip query/hash if present
              var qIdx = basename.indexOf("?");
              if (qIdx >= 0) basename = basename.substring(0, qIdx);
              var hIdx = basename.indexOf("#");
              if (hIdx >= 0) basename = basename.substring(0, hIdx);
              if (basename === cartName) {
                var data = FS.readFile("/" + cartName, { encoding: "binary" });
                if (data && data.buffer) {
                  // IMPORTANT: Use setTimeout to make the callback async.
                  // Emscripten's asyncLoad adds a run dependency AFTER
                  // readAsync returns.  If we call onload synchronously,
                  // the dependency is removed before it's added, causing
                  // the runtime to hang forever waiting for it.
                  setTimeout(function () {
                    onload(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
                  }, 0);
                  return;
                }
              }
            }
          } catch (e) {
            if (onerror) onerror(e);
            return;
          }
          // Fallback: runtime's XHR readAsync for non-cart resources.
          if (typeof runtimeReadAsync === "function") {
            runtimeReadAsync(url, onload, onerror);
          } else if (onerror) {
            onerror();
          }
        };
        postReady();
      },
      setStatus: function (m) {
        if (typeof m === "string" && m.toLowerCase().indexOf("error") !== -1) {
          postError(m);
        }
      },
    };

    // NOTE: The readAsync override below runs *before* the runtime script loads.
    // The runtime overwrites `window.readAsync` when it executes, so this override
    // is effectively dead code after that point.  The real override that survives
    // is applied inside `onRuntimeInitialized` above, which runs after the runtime
    // has loaded but before `callMain` triggers `FS.createPreloadedFile`.

    var script = document.createElement("script");
    script.src = scriptUrl;
    script.onerror = function () {
      postError("Failed to load TIC-80 runtime script");
    };
    document.body.appendChild(script);
  }

  // ---------- message channel ----------
  // Only accept init from the actual parent window. We track ready state to avoid
  // double-init if the parent re-sends (e.g. on re-mount).
  var initialized = false;
  var bootTimeoutId = null;

  window.addEventListener("message", function (event) {
    if (event.source !== parent) return;
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type !== "init" && data.type !== "destroy") return;

    if (data.type === "destroy") {
      if (bootTimeoutId !== null) {
        clearTimeout(bootTimeoutId);
        bootTimeoutId = null;
      }
      // Best-effort: drop Module so the GC can reclaim buffers.
      try { delete window.Module; } catch (e) { window.Module = undefined; }
      return;
    }

    if (initialized) return;
    initialized = true;

    try {
      postBooting();

      // 30s watchdog: if the runtime never reports ready, give up.
      bootTimeoutId = setTimeout(function () {
        postError("Tiempo de carga agotado (30s)");
        bootTimeoutId = null;
      }, 30_000);

      var jsBytes = new Uint8Array(data.jsBytes);
      var wasmBytes = new Uint8Array(data.wasmBytes);
      var cartBytes = new Uint8Array(data.cartBytes);
      var cartName = String(data.cartName || "cart.tic");
      handleInit(jsBytes, wasmBytes, cartBytes, cartName);
    } catch (e) {
      postError("handleInit threw: " + (e && e.message ? e.message : e));
    }
  });

  // Tell the parent we're alive and ready to receive init.
  post("booting");
})();
</script>
</body>
</html>
