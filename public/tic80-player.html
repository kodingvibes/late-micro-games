<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIC-80 Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas {
      display: block; margin: 0 auto;
      width: 100%; height: 100%;
      max-width: 100vw; max-height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    #fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font: 14px system-ui;
    }
  </style>
</head>
<body>
  <div id="fallback">Cargando…</div>
  <canvas id="canvas" width="240" height="136" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const cartUrl = params.get("cart");
      if (!cartUrl) {
        document.getElementById("fallback").textContent = "Falta el cart.";
        return;
      }

      const cartName = cartUrl.split("/").pop() || "cart.tic";

      try {
        const res = await fetch(cartUrl, { mode: "cors", credentials: "omit" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const cartBuf = await res.arrayBuffer();
        const cartBytes = new Uint8Array(cartBuf);

        const r = await fetch(window.location.pathname.replace(/[^/]+$/, "tic80.wasm"));
        if (!r.ok) throw new Error("wasm HTTP " + r.status);
        const wasmBuf = await r.arrayBuffer();

        const t = await fetch(window.location.pathname.replace(/[^/]+$/, "tic80.js"));
        if (!t.ok) throw new Error("js HTTP " + t.status);
        const jsText = await t.text();

        document.getElementById("fallback").style.display = "none";
        const canvas = document.getElementById("canvas");

        // Match the canvas to its CSS box so the C++ side picks a sane size.
        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          canvas.width = Math.max(240, Math.floor(rect.width));
          canvas.height = Math.max(136, Math.floor(rect.height));
        };
        resize();
        window.addEventListener("resize", resize);

        // The runtime reads `Module` synchronously. Set it before the
        // script tag parses. Seed `filePreloaded` so the bootstrap tick
        // skips the XHR preloader (we drop the cart in MEMFS in preRun).
        window.Module = {
          canvas,
          arguments: [cartName],
          wasmBinary: new Uint8Array(wasmBuf),
          filePreloaded: true,
          preRun: [() => {
            const sandbox = "/com.nesbox.tic/TIC-80";
            window.FS.mkdirTree(sandbox);
            window.FS.writeFile(sandbox + "/" + cartName, cartBytes);
          }],
        };

        const s = document.createElement("script");
        s.textContent = jsText;
        s.onerror = () => {
          document.getElementById("fallback").textContent = "Error cargando el runtime.";
        };
        document.body.appendChild(s);

        canvas.addEventListener("click", () => canvas.focus());
      } catch (e) {
        document.getElementById("fallback").textContent = "Error: " + e.message;
      }
    })();
  </script>
</body>
</html>
